<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git Profile</title>
    <link rel="stylesheet" href="style.css">
    
    </head>
    <body>
        <div class="card">
            <img id="avatar">
                <div class="details">
                    <p id="notFound"></p>
                    <p id="name"></p>
                    <p id="bio"></p>
                     <p id="followers"></p>
                    <p id="publicRepo"></p>
                    <a id="link" target="_blank"></a>
                <ul id="repoList"></ul>
            </div>
        
        </div>
        
        <script src="profile.js" defer></script>
    </body>
</html>
